# Section names matter. The al-folio CV renderer only knows a fixed set of
# section types (Education, Experience, Volunteer, Awards, Publications, Skills,
# Languages, Interests, Certificates, Projects, References). Anything else falls
# through to a generic renderer that understands only `label`/`details` pairs.
#
# Sections render in the order they appear below. That is only true because
# `_includes/cv/render.liquid` overrides the plugin's template -- upstream
# hoists Experience above everything else regardless of this file.
